<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Expense Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><h1>💰 Personal Expense Tracker</h1></header>
<main>
  <section class="cards">
    <div class="card inc"><span>Total Income</span><b id="totalIncome">0.00</b></div>
    <div class="card exp"><span>Total Expenses</span><b id="totalExpense">0.00</b></div>
    <div class="card bal"><span>Balance</span><b id="balance">0.00</b></div>
  </section>

  <section class="panel">
    <h2 id="formTitle">Add Transaction</h2>
    <div class="grid" id="txForm">
      <select id="type"><option value="expense">Expense</option><option value="income">Income</option></select>
      <input id="amount" type="number" min="0.01" step="0.01" placeholder="Amount">
      <input id="date" type="date">
      <select id="category"></select>
      <input id="description" type="text" placeholder="Description">
      <div class="btns">
        <button id="saveBtn" class="primary">Add</button>
        <button id="cancelBtn" class="ghost" hidden>Cancel</button>
      </div>
    </div>
    <p id="msg" class="msg"></p>
  </section>

  <section class="panel">
    <h2>Manage Categories</h2>
    <div class="row">
      <input id="newCat" type="text" placeholder="New category name">
      <button id="addCatBtn" class="primary">Add Category</button>
    </div>
    <div id="catList" class="chips"></div>
  </section>

  <section class="panel">
    <h2>Search &amp; Filter</h2>
    <div class="grid">
      <input id="fSearch" type="text" placeholder="Search description">
      <select id="fCategory"></select>
      <select id="fType"><option value="">All Types</option><option value="income">Income</option><option value="expense">Expense</option></select>
      <label>From <input id="fFrom" type="date"></label>
      <label>To <input id="fTo" type="date"></label>
      <button id="clearBtn" class="ghost">Clear Filters</button>
    </div>
  </section>

  <section class="panel">
    <h2>Transactions</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th><th>Actions</th></tr></thead>
        <tbody id="txBody"></tbody>
      </table>
    </div>
  </section>

  <section class="two">
    <div class="panel">
      <h2>Monthly Summary</h2>
      <div class="scroll">
        <table>
          <thead><tr><th>Month</th><th>Income</th><th>Expense</th><th>Net</th></tr></thead>
          <tbody id="monthBody"></tbody>
        </table>
      </div>
    </div>
    <div class="panel">
      <h2>Expense Chart
        <select id="chartMode"><option value="category">By Category</option><option value="month">By Month</option></select>
      </h2>
      <canvas id="chart" width="480" height="300"></canvas>
    </div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
